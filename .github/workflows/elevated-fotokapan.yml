name: Elevated Fotokapan acceptance

on:
  push:
    branches:
      - main
    paths:
      - fotokapan.ps1
      - lib/OpenRelax.Core.ps1
      - tests/elevated-fotokapan.ps1
      - .github/workflows/elevated-fotokapan.yml
  pull_request:
    branches:
      - main
    paths:
      - fotokapan.ps1
      - lib/OpenRelax.Core.ps1
      - tests/elevated-fotokapan.ps1
      - .github/workflows/elevated-fotokapan.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrelax-elevated-fotokapan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elevated-fotokapan:
    name: SYSTEM install, ACL, upgrade and uninstall
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise real elevated Fotokapan lifecycle
        id: acceptance
        shell: powershell
        run: .\tests\elevated-fotokapan.ps1

      - name: Record bounded elevated evidence
        if: always()
        shell: powershell
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'openrelax-elevated-evidence'
          [void][IO.Directory]::CreateDirectory($destination)
          $testedCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $testedCommit -notmatch '^[a-f0-9]{40}$') {
            throw 'Cannot identify tested source.'
          }
          [ordered]@{
            schemaVersion = 1
            repository = $env:GITHUB_REPOSITORY
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            testedCommit = $testedCommit
            eventCommit = $env:GITHUB_SHA
            elevatedFotokapan = $env:ACCEPTANCE_OUTCOME
            boundary = 'Disposable GitHub-hosted Windows runner only. Covers real Fotokapan install, SYSTEM task registration/start, protected ACL structure, same-source upgrade and uninstall with retained logs. It is not a real Windows Update restoration, cross-account logon/write attempt, reboot persistence, RDP, physical keyboard, Narrator, monitor-DPI, signed binary, stable release or LTS certification.'
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $destination 'evidence.json') -Encoding UTF8

      - name: Upload elevated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openrelax-elevated-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openrelax-elevated-evidence/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
