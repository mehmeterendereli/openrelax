name: Windows verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrelax-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-and-self-test:
    name: Parser + safety contracts
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify all parsers, safety contracts and isolated end-to-end modes
        shell: powershell
        run: .\tests\verify.ps1

      - name: Verify bounded traversal over owned synthetic files
        shell: powershell
        run: .\tests\engine-stress.ps1 -Dirs 8 -FilesPerDir 3

      - name: Verify native control semantics and constrained viewport
        shell: powershell
        run: .\tests\ui-smoke.ps1

      - name: Verify active-worker exit and all TR/EN renderers
        shell: powershell
        run: |
          .\tests\exit-smoke.ps1
          .\tests\visual-smoke.ps1
